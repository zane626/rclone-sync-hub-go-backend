basePath: /
definitions:
  internal_api.FSSubDir:
    properties:
      has_sub_dirs:
        type: boolean
      name:
        type: string
      path:
        type: string
    type: object
  internal_api.FSSubDirListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.FSSubDir'
        type: array
    type: object
  internal_api.LoginRequest:
    properties:
      password:
        maxLength: 1024
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - password
    - username
    type: object
  internal_api.TaskBatchReq:
    properties:
      ids:
        description: 任务 ID 列表
        items:
          type: integer
        maxItems: 1000
        minItems: 1
        type: array
    required:
    - ids
    type: object
  internal_api.TaskCreateReq:
    properties:
      file_name:
        type: string
      file_size:
        type: integer
      local_path:
        type: string
      remote_name:
        type: string
      remote_path:
        type: string
      watch_folder_id:
        type: integer
      watch_folder_name:
        type: string
    required:
    - local_path
    - remote_name
    - remote_path
    type: object
  internal_api.WatchFolderCreateReq:
    properties:
      filter_keywords:
        description: 可选，多行关键字，换行分隔，扫描时模糊匹配排除
        type: string
      local_path:
        type: string
      max_depth:
        description: 可选，0 表示不限制
        type: integer
      name:
        type: string
      remote_name:
        type: string
      remote_path:
        type: string
      scan_interval_seconds:
        description: 可选，默认 300
        type: integer
      sync_type:
        description: 可选，默认 local_to_remote
        type: string
    required:
    - local_path
    - name
    - remote_name
    - remote_path
    type: object
  internal_api.WatchFolderUpdateReq:
    properties:
      enabled:
        type: boolean
      filter_keywords:
        type: string
      local_path:
        type: string
      max_depth:
        type: integer
      name:
        type: string
      remote_name:
        type: string
      remote_path:
        type: string
      scan_interval_seconds:
        type: integer
      status:
        type: string
      sync_type:
        type: string
    type: object
  rclone-sync-hub_internal_model.FileRecord:
    properties:
      createdAt:
        type: string
      fileHash:
        description: 可选，内容哈希用于强校验
        type: string
      fileModTime:
        type: string
      fileSize:
        type: integer
      fingerprint:
        description: size + mtime 的快速元数据指纹
        type: string
      id:
        type: integer
      lastSeenAt:
        type: string
      localPath:
        type: string
      missingAt:
        description: 最近一次完整扫描确认文件已不存在
        type: string
      relativePath:
        description: 相对扫描根目录的路径
        type: string
      remoteName:
        type: string
      remotePath:
        type: string
      updatedAt:
        type: string
      uploadedAt:
        type: string
      watchFolderID:
        type: integer
    type: object
  rclone-sync-hub_internal_model.UploadLog:
    properties:
      bytesDone:
        type: integer
      bytesTotal:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      message:
        type: string
      percent:
        type: number
      speed:
        description: bytes/s
        type: integer
      taskID:
        type: integer
    type: object
  rclone-sync-hub_internal_model.UploadTask:
    properties:
      accumulatedFailures:
        description: 累计失败次数（便于分析）
        type: integer
      cancelRequestedAt:
        description: 运行中任务的取消请求
        type: string
      canceledAt:
        type: string
      createdAt:
        type: string
      durationSeconds:
        description: 时间维度
        type: integer
      errorMsg:
        description: 最后一次错误信息
        type: string
      fileFingerprint:
        description: 创建任务时的文件元数据指纹
        type: string
      fileName:
        description: 文件名
        type: string
      fileRecord:
        allOf:
        - $ref: '#/definitions/rclone-sync-hub_internal_model.FileRecord'
        description: 关联（不参与表结构，仅查询用）
      fileRecordID:
        type: integer
      fileSize:
        description: 文件信息
        type: integer
      finishedAt:
        description: 上传结束时间
        type: string
      heartbeatAt:
        description: 最近一次租约心跳
        type: string
      id:
        type: integer
      idempotencyKey:
        description: nullable，兼容旧数据并防止重复建任务
        type: string
      lastProgressAt:
        description: 最近一次进度上报时间
        type: string
      lastStatusAt:
        description: 最近一次状态变更时间
        type: string
      leaseExpiresAt:
        description: 租约到期时间
        type: string
      leaseOwner:
        description: 当前 worker 实例
        type: string
      localPath:
        description: 文件本地路径
        type: string
      log:
        description: 日志与分析
        type: string
      nextRetryAt:
        description: 下次允许领取时间
        type: string
      priority:
        description: 数值越大优先级越高
        type: integer
      progress:
        description: 上传进度（0-100）
        type: number
      remoteName:
        description: 上传网盘（remote 名称）
        type: string
      remotePath:
        description: 上传路径
        type: string
      retryCount:
        description: 已领取执行次数（包含首次）
        type: integer
      speed:
        description: 最近一次上报的速度（bytes/s）
        type: integer
      startedAt:
        description: 上传开始时间
        type: string
      status:
        description: 状态与进度
        type: string
      updatedAt:
        type: string
      watchFolderID:
        description: 归属与标识
        type: integer
      watchFolderName:
        description: 所属监听文件夹名称快照
        type: string
    type: object
  rclone-sync-hub_internal_model.WatchFolder:
    properties:
      createdAt:
        type: string
      enabled:
        description: 是否启用该监听
        type: boolean
      failedFileCount:
        description: 累计上传失败文件数
        type: integer
      filterKeywords:
        description: 过滤关键字，多行存储，每行一个；路径或文件名包含任一关键字（模糊匹配）则排除
        type: string
      id:
        type: integer
      lastActiveAt:
        description: 最近有文件变更 / 上传的时间
        type: string
      lastError:
        description: 最近一次错误信息（便于排查）
        type: string
      lastScanAt:
        description: 兼容字段：最近一次扫描开始时间
        type: string
      lastScanDurationMs:
        description: 最近一次扫描耗时（毫秒）
        type: integer
      lastScanFinishedAt:
        description: 最近一次扫描结束时间（无论成功失败）
        type: string
      lastScanStartedAt:
        description: 最近一次扫描开始时间
        type: string
      lastScanSuccessAt:
        description: 最近一次成功扫描结束时间
        type: string
      lastSyncAt:
        description: 最近一次同步时间
        type: string
      localPath:
        description: 注意：MySQL InnoDB 单列索引最大 3072 字节（utf8mb4 约 768 字符），且 LocalPath
          上有唯一索引，因此长度限制为 768。
        type: string
      maxDepth:
        description: 最大监听深度，0 表示不限制
        type: integer
      name:
        description: 基本配置
        type: string
      nextScanAt:
        description: 预计下一次扫描时间（可选）
        type: string
      remoteName:
        description: rclone remote 名称
        type: string
      remotePath:
        description: 远端路径
        type: string
      scanIntervalSeconds:
        description: 配置相关扩展
        type: integer
      scanLeaseExpiresAt:
        type: string
      scanLeaseOwner:
        type: string
      status:
        description: 状态信息
        type: string
      syncType:
        description: 同步类型
        type: string
      totalFileCount:
        description: 统计维度（便于分析与展示）
        type: integer
      totalFileSize:
        description: 当前已知文件总大小（字节）
        type: integer
      updatedAt:
        type: string
      uploadedBytes:
        description: 累计已上传字节数
        type: integer
      uploadedFileCount:
        description: 累计已成功上传文件数
        type: integer
      windowUploadedBytes:
        description: 窗口内上传字节数
        type: integer
      windowUploadedFiles:
        description: 最近一段时间的窗口统计（可用于展示趋势）
        type: integer
    type: object
  rclone-sync-hub_internal_service.DashboardData:
    properties:
      by_status:
        description: ByStatus 按状态分布（饼图/柱状图）
        items:
          $ref: '#/definitions/rclone-sync-hub_internal_service.StatusItemVO'
        type: array
      by_time:
        description: ByTime 按日趋势（折线图）
        items:
          $ref: '#/definitions/rclone-sync-hub_internal_service.TimeItemVO'
        type: array
      by_watch_folder:
        description: ByWatchFolder 按监听文件夹分布（表格+柱状图）
        items:
          $ref: '#/definitions/rclone-sync-hub_internal_service.WatchFolderItemVO'
        type: array
      items:
        allOf:
        - $ref: '#/definitions/rclone-sync-hub_internal_service.DashboardItemsVO'
        description: Items 列表类数据
      overview:
        allOf:
        - $ref: '#/definitions/rclone-sync-hub_internal_service.OverviewVO'
        description: Overview 概览数字（卡片）
    type: object
  rclone-sync-hub_internal_service.DashboardItemsVO:
    properties:
      failed_tasks:
        items:
          $ref: '#/definitions/rclone-sync-hub_internal_model.UploadTask'
        type: array
      recent_tasks:
        items:
          $ref: '#/definitions/rclone-sync-hub_internal_model.UploadTask'
        type: array
    type: object
  rclone-sync-hub_internal_service.OverviewVO:
    properties:
      recent_24h_completed:
        type: integer
      recent_24h_failed:
        type: integer
      task_canceled:
        type: integer
      task_failed:
        type: integer
      task_paused:
        type: integer
      task_pending:
        type: integer
      task_running:
        type: integer
      task_success:
        type: integer
      task_total:
        type: integer
      uploaded_bytes_total:
        type: integer
      uploaded_files_total:
        type: integer
      watch_folder_count:
        type: integer
    type: object
  rclone-sync-hub_internal_service.StatusItemVO:
    properties:
      count:
        type: integer
      label:
        type: string
      status:
        type: string
    type: object
  rclone-sync-hub_internal_service.TaskBatchResult:
    properties:
      failed:
        additionalProperties:
          type: string
        type: object
      ok_ids:
        items:
          type: integer
        type: array
    type: object
  rclone-sync-hub_internal_service.TimeItemVO:
    properties:
      completed_count:
        type: integer
      date:
        type: string
      failed_count:
        type: integer
      uploaded_bytes:
        type: integer
    type: object
  rclone-sync-hub_internal_service.WatchFolderItemVO:
    properties:
      canceled_count:
        type: integer
      failed_count:
        type: integer
      paused_count:
        type: integer
      pending_count:
        type: integer
      running_count:
        type: integer
      success_count:
        type: integer
      task_count:
        type: integer
      uploaded_bytes:
        type: integer
      uploaded_files:
        type: integer
      watch_folder_id:
        type: integer
      watch_folder_name:
        type: string
    type: object
info:
  contact:
    name: Project repository
    url: https://github.com/zane626/rclone-sync-hub-go-backend
  description: 面向生产环境的本地文件扫描、持久化上传队列与 rclone 调度 API。
  title: Rclone Sync Hub API
  version: "2.0"
paths:
  /api/analytics/dashboard:
    get:
      consumes:
      - application/json
      description: 返回概览数字、按状态/按监听文件夹/按时间趋势的图表数据，以及最近任务与失败任务列表，供数据分析页一次拉取
      parameters:
      - description: 趋势图天数，默认 7
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone-sync-hub_internal_service.DashboardData'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 数据分析仪表盘
      tags:
      - analytics
  /api/audit-logs:
    get:
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 50
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取操作审计日志
      tags:
      - operations
  /api/auth/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 获取认证配置
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名和密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 登录
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - auth
  /api/events:
    get:
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 订阅任务实时事件
      tags:
      - events
  /api/fs/subdirs:
    get:
      description: 根据传入的本地路径，返回该路径下所有一级子文件夹（不包含文件）
      parameters:
      - description: 本地起始路径，如 /volumes
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.FSSubDirListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取指定路径下的子文件夹
      tags:
      - filesystem
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 兼容健康检查
      tags:
      - health
  /api/health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 存活检查
      tags:
      - health
  /api/health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 就绪检查
      tags:
      - health
  /api/rclone/configs:
    get:
      description: 调用 `rclone listremotes --long` 获取 remote 名称与类型，不读取配置密钥
      produces:
      - application/json
      responses:
        "200":
          description: items 为 remote 列表
          schema:
            additionalProperties: true
            type: object
        "500":
          description: error 为错误信息
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取 rclone remote 配置列表
      tags:
      - rclone
  /api/scan:
    post:
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: 异步触发全部启用目录扫描
      tags:
      - scanner
  /api/scan-runs:
    get:
      parameters:
      - description: 监听目录 ID；0 为全部
        in: query
        name: watch_folder_id
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 50
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取扫描历史
      tags:
      - operations
  /api/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务状态统计
      tags:
      - tasks
  /api/tasks:
    get:
      consumes:
      - application/json
      description: 按状态筛选并分页返回上传任务，不传 status 时返回全部；keyword 对 watch_folder_name/file_name/local_path/remote_name/remote_path
        模糊查询
      parameters:
      - description: '任务状态: pending|running|success|failed|paused|canceled，空为全部'
        in: query
        name: status
        type: string
      - description: 关键词：对所属文件夹名/文件名/本地路径/网盘名/上传路径模糊查询
        in: query
        name: keyword
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items 为任务列表，total 为总条数
          schema:
            additionalProperties: true
            type: object
        "500":
          description: error 为错误信息
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 分页获取上传任务列表
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: 新建一个上传任务（默认状态为待上传）
      parameters:
      - description: 任务配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.TaskCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone-sync-hub_internal_model.UploadTask'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建上传任务
      tags:
      - tasks
  /api/tasks/{id}:
    delete:
      description: 上传中的任务不可删除
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除上传任务
      tags:
      - tasks
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rclone-sync-hub_internal_model.UploadTask'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取上传任务
      tags:
      - tasks
  /api/tasks/{id}/cancel:
    post:
      description: 等待中的任务立即取消；运行中的任务在 worker 心跳后终止 rclone 进程
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: 取消上传任务
      tags:
      - tasks
  /api/tasks/{id}/logs:
    get:
      consumes:
      - application/json
      description: 按任务 ID 返回 upload_logs 中的日志列表，支持 limit 限制条数
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 最多返回条数，默认 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rclone-sync-hub_internal_model.UploadLog'
            type: array
        "400":
          description: invalid id
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务上传日志
      tags:
      - tasks
