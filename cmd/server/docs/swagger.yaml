  /api/watch-folders:
    get:
      description: 按状态分页获取监听文件夹列表
      parameters:
      - description: '状态: detecting|watching|stopped|paused|error'
        in: query
        name: status
        type: string
      - description: 关键词：对 name/local_path/remote_name/remote_path 模糊查询
        in: query
        name: keyword
        type: string
      - default: 1
        description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: items 为列表，total 为总数
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 列出监听文件夹
      tags:
      - watch-folders
    post:
